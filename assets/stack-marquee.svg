<svg width="1200" height="124" viewBox="0 0 1200 124" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="1" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1" />
    </linearGradient>
    <clipPath id="clip">
      <rect width="1200" height="124" rx="12" />
    </clipPath>
  </defs>

  <style>
    .pill { fill: #140B07; stroke: #431407; stroke-width: 1.2; }
    .pill-hot { fill: #1F1009; stroke: #EA580C; stroke-opacity: 0.75; stroke-width: 1.2; }
    .label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #D6D3D1;
    }
    .label-hot {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #FDBA74;
    }
    .row1 { animation: scrollLeft 22s linear infinite; }
    .row2 { animation: scrollRight 25s linear infinite; }

    @keyframes scrollLeft {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-1120px); }
    }
    @keyframes scrollRight {
      0% { transform: translateX(-1120px); }
      100% { transform: translateX(0px); }
    }
  </style>

  <g clip-path="url(#clip)">
    <g class="row1">
