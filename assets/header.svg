<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0B1324" />
      <stop offset="100%" stop-color="#06283D" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: #F8FAFC;
      letter-spacing: -0.5px;
      animation: fadeUp 0.9s ease-out forwards;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 600;
      fill: #22D3EE;
      letter-spacing: 0.4px;
      animation: fadeUp 1.2s ease-out forwards;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      fill: #94A3B8;
      letter-spacing: 0.6px;
      animation: fadeUp 1.5s ease-out forwards;
    }
    .pulse {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .scanline {
      animation: scan 6s linear infinite;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes scan {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
  </style>

  
  <rect width="1200" height="260" rx="16" fill="url(#bg)" />
  <rect width="1200" height="260" rx="16" fill="url(#grid)" />

  
  <circle cx="220" cy="130" r="210" fill="url(#glow)" class="pulse" />
  <circle cx="980" cy="130" r="210" fill="url(#glow)" class="pulse" />

  
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" />
  <rect x="0" y="257" width="1200" height="3" fill="url(#accent)" />
  <rect x="0" y="255" width="260" height="5" fill="#22D3EE" opacity="0.85" class="scanline" />

  
  <text x="600" y="108" text-anchor="middle" class="title">Muhammad Arsalan Warsi</text>
  <text x="600" y="152" text-anchor="middle" class="subtitle">Full-Stack &amp; Cross-Platform Software Engineer</text>
  <text x="600" y="190" text-anchor="middle" class="tagline">NEXT.JS  •  NESTJS  •  RUST  •  TYPESCRIPT  •  REACT NATIVE  •  TAURI  •  ELECTRON  •  MERN</text>
</svg>
