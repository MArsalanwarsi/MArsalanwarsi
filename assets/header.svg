<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="outerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140B07" />
      <stop offset="50%" stop-color="#0D0907" />
      <stop offset="100%" stop-color="#1C0E08" />
    </linearGradient>
    <radialGradient id="topGlow" cx="45%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#9A3412" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0D0907" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bottomGlow" cx="55%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#0D0907" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="emberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#EA580C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
  </defs>

  <style>
    .handle {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 16px;
      font-weight: 700;
      fill: #FB923C;
      letter-spacing: 0.5px;
    }
    .name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: url(#nameGrad);
      letter-spacing: -1px;
      animation: fadeUp 0.8s ease-out forwards;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      fill: #E7E5E4;
      opacity: 0.9;
      animation: fadeUp 1.1s ease-out forwards;
    }
    .pill-bg {
      fill: #1C100B;
      fill-opacity: 0.75;
      stroke: #9A3412;
      stroke-width: 1.2;
    }
    .pill-txt {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      fill: #FDBA74;
    }
    .stat-num {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 44px;
      font-weight: 800;
      fill: #FB923C;
      letter-spacing: -1px;
    }
    .stat-lbl {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 11.5px;
      font-weight: 700;
      fill: #D6D3D1;
      letter-spacing: 2px;
    }
    .emblem-txt {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 44px;
      font-weight: 800;
      fill: #FDBA74;
      letter-spacing: -2px;
    }
    .breathe { animation: breatheGlow 5s ease-in-out infinite; }
    .ring-spin {
      transform-origin: 126px 128px;
      animation: spinSlow 18s linear infinite;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes breatheGlow {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  
  <rect x="2" y="2" width="1196" height="306" rx="22" fill="url(#outerBg)" stroke="#431407" stroke-width="1.5" />
  <rect x="2" y="2" width="1196" height="306" rx="22" fill="url(#topGlow)" class="breathe" />
  <rect x="2" y="2" width="1196" height="306" rx="22" fill="url(#bottomGlow)" class="breathe" />

  
  <rect x="22" y="20" width="1156" height="270" rx="18" fill="none" stroke="url(#emberBorder)" stroke-width="1.3" />

  
  <circle cx="126" cy="128" r="64" fill="#140B07" stroke="#431407" stroke-width="2" />
  <circle cx="126" cy="128" r="68" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="14 8" class="ring-spin" />
  <text x="126" y="143" text-anchor="middle" class="emblem-txt">AW</text>

  
  <text x="226" y="88" class="handle">@MArsalanwarsi</text>
  <text x="226" y="144" class="name">Muhammad Arsalan Warsi</text>
  <text x="226" y="178" class="tagline">Building scalable, secure Web, Mobile &amp; Desktop systems with architectural clarity.</text>

  
  <g transform="translate(64, 218)">
    <rect x="0" y="0" width="122" height="38" rx="19" class="pill-bg" /><text x="61" y="24" text-anchor="middle" class="pill-txt">TypeScript</text>
    <rect x="138" y="0" width="108" height="38" rx="19" class="pill-bg" /><text x="192" y="24" text-anchor="middle" class="pill-txt">Next.js</text>
    <rect x="262" y="0" width="105" height="38" rx="19" class="pill-bg" /><text x="314" y="24" text-anchor="middle" class="pill-txt">NestJS</text>
    <rect x="383" y="0" width="90" height="38" rx="19" class="pill-bg" /><text x="428" y="24" text-anchor="middle" class="pill-txt">Rust</text>
    <rect x="489" y="0" width="136" height="38" rx="19" class="pill-bg" /><text x="557" y="24" text-anchor="middle" class="pill-txt">React Native</text>
    <rect x="641" y="0" width="142" height="38" rx="19" class="pill-bg" /><text x="712" y="24" text-anchor="middle" class="pill-txt">Tauri • Electron</text>
  </g>

  
  <text x="1038" y="140" text-anchor="middle" class="stat-num">25+</text>
  <text x="1038" y="166" text-anchor="middle" class="stat-lbl">PUBLIC REPOS</text>

  
  <text x="1152" y="274" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#9A3412" opacity="0.85">arsalanwarsi.vercel.app</text>
</svg>
