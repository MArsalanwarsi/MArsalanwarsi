<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0A0A0C" />
      <stop offset="100%" stop-color="#141417" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A1A1AA" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#A1A1AA" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#27272A" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 50px;
      font-weight: 800;
      fill: url(#textGrad);
      letter-spacing: -1px;
      animation: fadeUp 0.8s ease-out forwards;
    }
    .role {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #D4D4D8;
      letter-spacing: 0.6px;
      animation: fadeUp 1.1s ease-out forwards;
    }
    .pill-text {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 11.5px;
      font-weight: 700;
      fill: #E4E4E7;
      letter-spacing: 1.4px;
    }
    .float1 { animation: floatA 9s ease-in-out infinite; }
    .float2 { animation: floatB 11s ease-in-out infinite; }
    .dot-pulse { animation: pulseDot 2.2s ease-in-out infinite; }
    .sweep { animation: sweepLine 5.5s linear infinite; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatA {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(30px, -15px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-30px, 15px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; r: 4; }
      50% { opacity: 0.3; r: 6; }
    }
    @keyframes sweepLine {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
  </style>

  
  <rect x="1" y="1" width="1198" height="278" rx="18" fill="url(#bg)" stroke="#27272A" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="278" rx="18" fill="url(#grid)" />

  
  <circle cx="240" cy="110" r="240" fill="url(#orb1)" class="float1" />
  <circle cx="960" cy="170" r="250" fill="url(#orb2)" class="float2" />

  
  <rect x="0" y="0" width="1200" height="2" fill="url(#borderGrad)" />
  <rect x="0" y="277" width="320" height="2.5" fill="#FFFFFF" opacity="0.7" class="sweep" />

  
  <rect x="462" y="38" width="276" height="30" rx="15" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
  <circle cx="484" cy="53" r="4" fill="#FFFFFF" class="dot-pulse" />
  <text x="500" y="57" class="pill-text">OPEN TO HIGH-IMPACT ROLES</text>

  
  <text x="600" y="138" text-anchor="middle" class="name">Muhammad Arsalan Warsi</text>
  <text x="600" y="182" text-anchor="middle" class="role">Full-Stack &amp; Cross-Platform Software Engineer</text>

  
  <text x="600" y="226" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#71717A" letter-spacing="1.5">
    WEB (NEXT.JS • MERN)   |   BACKEND (NESTJS • RUST)   |   MOBILE &amp; DESKTOP (REACT NATIVE • TAURI • ELECTRON)
  </text>
</svg>
